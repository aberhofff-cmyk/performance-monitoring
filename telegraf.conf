[agent]
  interval = "15s"
  flush_interval = "15s"

# ---- Отдаём метрики в формате Prometheus ----
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2

# ---- Сбор метрик Docker-контейнеров ----
# Начиная с Telegraf 1.38 опции perdevice/total удалены,
# вместо них используются perdevice_include / total_include.
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  timeout = "5s"
  perdevice_include = ["cpu"]
  total_include = ["cpu", "network"]
  container_name_include = []
  container_name_exclude = []
  container_state_include = ["running", "paused"]
  docker_label_include = []

# Проверка метрик:
#   curl http://localhost:9273/metrics | grep docker_container
# Дашборд основан на https://grafana.com/grafana/dashboards/25012
