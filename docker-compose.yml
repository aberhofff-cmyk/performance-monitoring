services:
  # ===================== Мониторинг =====================
  telegraf:
    image: telegraf:latest
    container_name: telegraf
    user: root                      # доступ к docker.sock
    entrypoint: ["telegraf"]        # иначе entrypoint образа понижает права до пользователя telegraf
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9273:9273"                 # метрики контейнеров для Prometheus
    depends_on:
      - db
      - app1
      - app2
      - app3

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - /:/host:ro                  # без rslave: в Docker Desktop корень не является shared mount
    ports:
      - "9100:9100"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - telegraf
      - node-exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # ===================== Приложение =====================
  db:
    image: postgres:15-alpine
    container_name: perf_db
    environment:
      POSTGRES_USER: perf_user
      POSTGRES_PASSWORD: perf_pass
      POSTGRES_DB: perf_shop
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perf_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  app1:
    build: .
    container_name: perf_app1
    environment:
      - INSTANCE_ID=app1
      - DATABASE_URL=postgresql://perf_user:perf_pass@db:5432/perf_shop
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  app2:
    build: .
    container_name: perf_app2
    environment:
      - INSTANCE_ID=app2
      - DATABASE_URL=postgresql://perf_user:perf_pass@db:5432/perf_shop
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

  app3:
    build: .
    container_name: perf_app3
    environment:
      - INSTANCE_ID=app3
      - DATABASE_URL=postgresql://perf_user:perf_pass@db:5432/perf_shop
    ports:
      - "8003:8000"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: perf_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
